# Monthly pull requests for the digest-pinned images (Dockerfile, compose.yml)
# and the CI actions, all actions in one (development.md §7.2). Deno is pinned
# in three places (Dockerfile, deno.json, .tool-versions) and moves by hand,
# all at once.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: denoland/deno
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
