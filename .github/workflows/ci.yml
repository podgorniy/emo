# SPDX-License-Identifier: AGPL-3.0-or-later
# The one CI workflow (development.md §6): one Deno version (.tool-versions), Linux.
# Secrets: only the registry token GitHub provides; never instance secrets.
name: ci

# Pushes to main and v* tags; a pull request runs once, on its own event.
# perf runs on a v* tag or by hand (Actions → ci → Run workflow, any ref).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # fmt-check, lint (SPDX, style=, forbidden words, i18n), tests incl. the
  # crypto vectors, build incl. the size budget
  ci:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .tool-versions
          cache: true # keyed on deno.lock
      - run: make ci

  # Playwright against the compiled binary: no CSP violation on any screen,
  # the crypto vectors in Chromium. Pull requests and pushes to main
  e2e:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .tool-versions
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('deno.lock') }}
      - run: make e2e E2E_BROWSER_FLAGS=--with-deps
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e/report/

  # A v* tag: the image to ghcr.io and the binaries on the GitHub release
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .tool-versions
          cache: true
      - run: make release-check
      - name: Image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version"; exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/emo"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          make docker-build
          for tag in "$version" latest; do
            docker tag "emo:$version" "$image:$tag"
            docker push "$image:$tag"
          done
      - name: Binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          make release-binaries
          mv bin/emo-x86_64-unknown-linux-gnu bin/emo-linux-x86_64
          mv bin/emo-aarch64-unknown-linux-gnu bin/emo-linux-arm64
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            bin/emo-linux-x86_64 bin/emo-linux-arm64

  # make perf on a v* tag, or by hand on the chosen ref; fails below the
  # Lighthouse minimum (performance.md §1.4). Not a release gate: shared
  # runners make Lighthouse noisy
  perf:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .tool-versions
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('deno.lock') }}
      - run: make perf E2E_BROWSER_FLAGS=--with-deps
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: perf/report/
