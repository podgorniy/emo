<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Emo — desktop</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap"
          rel="stylesheet">
        <style>
        body {
          margin: 0;
        }
        </style>
      </helmet>
      <div
        style="min-height: 800px; box-sizing: border-box; background: #E4EDF1; color: #1E2A26; font-family: 'Onest', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column">
        <header
          style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 32px; border-bottom: 1px solid #C9D6DC">
          <span
            style="font-size: 17px; font-weight: 600; letter-spacing: .02em">Emo</span>
          <nav aria-label="Panes"
            style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: #D3E0E6">
            <a href="#" aria-current="page"
              style="min-height: 36px; display: flex; align-items: center; padding: 0 14px; border-radius: 9px; background: #FFFFFF; color: #1E2A26; text-decoration: none; font-size: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.12)">Check-in</a>
            <a href="#"
              style="min-height: 36px; display: flex; align-items: center; padding: 0 14px; border-radius: 9px; color: #36413C; text-decoration: none; font-size: 14px">Settings</a>
          </nav>
          <span role="img" aria-label="Synced"
            style="width: 10px; height: 10px; border-radius: 50%; background: #7F877F"></span>
        </header>

        <main
          style="flex: 1; display: flex; justify-content: center; padding: 48px 24px">
          <div
            style="width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 28px">
            <div style="display: flex; align-items: center; gap: 16px">
              <div aria-hidden="true"
                style="flex: 1; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px">
                <span
                  style="height: 4px; border-radius: 2px; background: #4F46E5"></span>
                <span
                  style="height: 4px; border-radius: 2px; background: #4F46E5"></span>
                <span
                  style="height: 4px; border-radius: 2px; background: #BCC5C0"></span>
                <span
                  style="height: 4px; border-radius: 2px; background: #BCC5C0"></span>
                <span
                  style="height: 4px; border-radius: 2px; background: #BCC5C0"></span>
                <span
                  style="height: 4px; border-radius: 2px; background: #BCC5C0"></span>
                <span
                  style="height: 4px; border-radius: 2px; background: #BCC5C0"></span>
                <span
                  style="height: 4px; border-radius: 2px; background: #BCC5C0"></span>
                <span
                  style="height: 4px; border-radius: 2px; background: #BCC5C0"></span>
                <span
                  style="height: 4px; border-radius: 2px; background: #BCC5C0"></span>
              </div>
              <button
                style="min-height: 44px; border: none; background: none; font: inherit; font-size: 15px; color: #4E5853; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">Skip check-in</button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <h1
                style="margin: 0; font-size: 34px; font-weight: 500; letter-spacing: -0.01em">What is it like?</h1>
              <p
                style="margin: 0; font-size: 16px; color: #4E5853">Choose any that fit</p>
            </div>
            <div role="group" aria-label="Qualities"
              style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 8px">
              <button aria-pressed="false"
                style="min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #B3BDB7; background: #F7FAFB; font: inherit; font-size: 16px; text-align: left; color: #1E2A26">heavy</button>
              <button aria-pressed="false"
                style="min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #B3BDB7; background: #F7FAFB; font: inherit; font-size: 16px; text-align: left; color: #1E2A26">light</button>
              <button aria-pressed="true"
                style="min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #1E2A26; background: #1E2A26; font: inherit; font-size: 16px; text-align: left; color: #FFFFFF">tight</button>
              <button aria-pressed="false"
                style="min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #B3BDB7; background: #F7FAFB; font: inherit; font-size: 16px; text-align: left; color: #1E2A26">pressing outward</button>
              <button aria-pressed="true"
                style="min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #1E2A26; background: #1E2A26; font: inherit; font-size: 16px; text-align: left; color: #FFFFFF">lump</button>
              <button aria-pressed="false"
                style="min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #B3BDB7; background: #F7FAFB; font: inherit; font-size: 16px; text-align: left; color: #1E2A26">warm</button>
              <button aria-pressed="false"
                style="min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #B3BDB7; background: #F7FAFB; font: inherit; font-size: 16px; text-align: left; color: #1E2A26">hot</button>
              <button aria-pressed="false"
                style="min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #B3BDB7; background: #F7FAFB; font: inherit; font-size: 16px; text-align: left; color: #1E2A26">cold</button>
              <button aria-pressed="false"
                style="min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #B3BDB7; background: #F7FAFB; font: inherit; font-size: 16px; text-align: left; color: #1E2A26">trembling</button>
              <button aria-pressed="false"
                style="min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #B3BDB7; background: #F7FAFB; font: inherit; font-size: 16px; text-align: left; color: #1E2A26">tingling</button>
              <button aria-pressed="false"
                style="min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #B3BDB7; background: #F7FAFB; font: inherit; font-size: 16px; text-align: left; color: #1E2A26">pulsing</button>
              <button aria-pressed="false"
                style="min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #B3BDB7; background: #F7FAFB; font: inherit; font-size: 16px; text-align: left; color: #1E2A26">numb</button>
              <button aria-pressed="false"
                style="min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #B3BDB7; background: #F7FAFB; font: inherit; font-size: 16px; text-align: left; color: #1E2A26">hollow</button>
              <button aria-pressed="false"
                style="min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #B3BDB7; background: #F7FAFB; font: inherit; font-size: 16px; text-align: left; color: #1E2A26">queasy</button>
              <button aria-pressed="false"
                style="min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 3px solid #4F46E5; background: #F7FAFB; font: inherit; font-size: 16px; text-align: left; color: #1E2A26">tense</button>
              <button aria-pressed="false"
                style="min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #B3BDB7; background: #F7FAFB; font: inherit; font-size: 16px; text-align: left; color: #1E2A26">relaxed</button>
              <button aria-pressed="false"
                style="min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #B3BDB7; background: #F7FAFB; font: inherit; font-size: 16px; text-align: left; color: #1E2A26">aching</button>
              <button aria-pressed="false"
                style="min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #B3BDB7; background: #F7FAFB; font: inherit; font-size: 16px; text-align: left; color: #1E2A26">pulling</button>
              <button aria-pressed="false"
                style="min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #B3BDB7; background: #F7FAFB; font: inherit; font-size: 16px; text-align: left; color: #1E2A26">tickly</button>
              <button aria-pressed="false"
                style="min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #B3BDB7; background: #F7FAFB; font: inherit; font-size: 16px; text-align: left; color: #1E2A26">nothing</button>
              <button aria-pressed="false"
                style="min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #B3BDB7; background: #F7FAFB; font: inherit; font-size: 16px; text-align: left; color: #1E2A26">can’t tell</button>
            </div>
            <div style="display: flex; gap: 12px">
              <button aria-label="Back"
                style="width: 56px; height: 56px; border-radius: 16px; border: 1.5px solid #B3BDB7; background: #F7FAFB; display: flex; align-items: center; justify-content: center; cursor: pointer">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
                  stroke="#1E2A26" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" aria-hidden="true">
                  <path d="M15 5l-7 7 7 7"></path>
                </svg>
              </button>
              <button
                style="flex: 1; height: 56px; border-radius: 16px; border: none; background: #1E2A26; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 500; cursor: pointer">Next</button>
            </div>
          </div>
        </main>

        <footer
          style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 24px; padding: 16px 24px 24px; font-size: 13px; color: #4E5853">
          <span><kbd style="font-family: 'JetBrains Mono', ui-monospace, monospace; padding: 2px 6px; border-radius: 6px; background: #D3E0E6; color: #1E2A26">←</kbd> <kbd style="font-family: 'JetBrains Mono', ui-monospace, monospace; padding: 2px 6px; border-radius: 6px; background: #D3E0E6; color: #1E2A26">→</kbd> back / next</span>
          <span><kbd style="font-family: 'JetBrains Mono', ui-monospace, monospace; padding: 2px 6px; border-radius: 6px; background: #D3E0E6; color: #1E2A26">Tab</kbd> move between options</span>
          <span><kbd style="font-family: 'JetBrains Mono', ui-monospace, monospace; padding: 2px 6px; border-radius: 6px; background: #D3E0E6; color: #1E2A26">Space</kbd> select</span>
          <span><kbd style="font-family: 'JetBrains Mono', ui-monospace, monospace; padding: 2px 6px; border-radius: 6px; background: #D3E0E6; color: #1E2A26">Ctrl</kbd> + <kbd style="font-family: 'JetBrains Mono', ui-monospace, monospace; padding: 2px 6px; border-radius: 6px; background: #D3E0E6; color: #1E2A26">Enter</kbd> save note</span>
        </footer>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script
      data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
  </body>
</html>
