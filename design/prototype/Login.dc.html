<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Emo — sign in</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap"
          rel="stylesheet">
        <style>
        body {
          margin: 0;
        }
        </style>
      </helmet>
      <div
        style="width: 390px; height: 844px; box-sizing: border-box; background: #E4EDF1; color: #1E2A26; font-family: 'Onest', 'Segoe UI', system-ui, sans-serif; padding: 72px 24px 32px; display: flex; flex-direction: column; gap: 32px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span
            style="font-size: 17px; font-weight: 600; letter-spacing: .02em">Emo</span>
          <h1
            style="margin: 0; font-size: 28px; font-weight: 500; letter-spacing: -0.01em">Code from the email</h1>
          <p
            style="margin: 0; font-size: 16px; line-height: 1.45; color: #36413C">We sent 6 digits to p•••••son@example.com. The code works for 10 minutes.</p>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="lg-code"
            style="font-size: 14px; color: #36413C">Code</label>
          <input id="lg-code" inputmode="numeric" autocomplete="one-time-code"
            maxlength="6" value="4821"
            style="height: 64px; box-sizing: border-box; padding: 0 20px; border-radius: 14px; border: 2px solid #4F46E5; background: #F7FAFB; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 30px; letter-spacing: .5em; color: #1E2A26">
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <button
            style="height: 56px; border-radius: 16px; border: none; background: #A9B4AE; color: #F7FAFB; font: inherit; font-size: 17px; font-weight: 500"
            disabled>Sign in</button>
          <button
            style="min-height: 44px; border: none; background: none; font: inherit; font-size: 15px; color: #4E5853">Resend in 0:42</button>
        </div>
        <div
          style="margin-top: auto; display: flex; flex-direction: column; gap: 4px">
          <button
            style="min-height: 44px; border: none; background: none; font: inherit; font-size: 15px; color: #4338CA; text-decoration: underline; text-underline-offset: 3px; text-align: left; padding: 0">Use a different email</button>
          <p
            style="margin: 0; font-size: 13px; line-height: 1.4; color: #4E5853">New accounts need an invite code. It is asked for on the previous step.</p>
        </div>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
  </body>
</html>
