                </div>

            </div>
          </section>
        </sc-for>
        <section style="display: flex; flex-direction: column; gap: 18px">
          <div

          </div>

          </div>
        </section>
      </div>

const TINT = (() => {

    const d = mx - mn; const s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn); const H = (mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60; return [H, s * 100, l * 100]; };
  const hsl = (h, s, l) => { h = ((h % 360) + 360) % 360; s = Math.max(0, Math.min(100, s)) / 100; l = Math.max(0, Math.min(100, l)) / 100; const k = (n) => (n + h / 30) % 12; const a = s * Math.min(l, 1 - l);
    const f = (n) => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))))); return '#' + [f(0), f(8), f(4)].map((x) => x.toString(16).padStart(2, '0')).join('').toUpperCase(); };
  const lum = (h) => { const a = hx(h).map((x) => { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); }); return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2]; };

      accent: accent, choice: p && p.choice === 'accent' ? accent : ink, onChoice: '#FFFFFF', figure: surface, figureLine: hsl(H, S * 0.25, 57),
      figureSel: accent, bloom: hsl(H + 12, S, 42), primary: p && p.primary === 'accent' ? accent : ink, onPrimary: '#FFFFFF' };
  };

    const [H, S0] = toHsl(seed); const S = Math.max(25, Math.min(80, S0));
    const ground = hsl(H, S * 0.45, 9), accent = fit(H, S, 66, hsl(H, S * 0.4, 14), 1);
    return { ground: ground, surface: hsl(H, S * 0.4, 14), ink: hsl(H, S * 0.25, 94), muted: hsl(H, S * 0.15, 68), line: hsl(H, S * 0.3, 25), track: hsl(H, S * 0.3, 19),
      accent: accent, choice: accent, onChoice: hsl(H, S * 0.5, 9), figure: hsl(H, S * 0.35, 12), figureLine: hsl(H, S * 0.25, 30), figureSel: accent, bloom: accent,
      primary: hsl(H, S * 0.25, 94), onPrimary: ground };
  };
  const apply = (preset, seed, grad, seed2) => {
    const t = JSON.parse(JSON.stringify(preset));
    if (preset.tint && seed) t.c = preset.tint === 'dark' ? dark(seed) : light(seed, preset.tp);
    if (preset.tint && grad && seed2) t.c.ground2 = preset.tint === 'dark' ? dark(seed2).track : light(seed2, preset.tp).ground;
    t.seed = seed || null; t.grad = !!(preset.tint && grad); t.seed2 = grad ? seed2 : null;
    return t;
  };
  const checks = (c) => {
    const grounds = [c.ground].concat(c.ground2 ? [c.ground2] : []);
    const pairs = [['text', c.ink, c.ground], ['buttons', c.onPrimary, c.primary], ['selected', c.onChoice, c.choice], ['cards', c.ink, c.surface]];
    grounds.forEach((g, i) => pairs.push(['secondary text' + (i ? ' (gradient)' : ''), c.muted, g]));
    if (c.ground2) pairs.push(['text (gradient)', c.ink, c.ground2]);

    return { readable: bad.length === 0, bad: bad, warm: warm(c.figureSel) || warm(c.bloom), dark: lum(c.ground) < 0.2 };
  };

})();
